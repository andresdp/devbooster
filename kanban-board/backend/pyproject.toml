[project]
name = "kanban-backend"
version = "0.1.0"
description = "Kanban ticketing system REST API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "sqlmodel",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
